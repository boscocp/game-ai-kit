# Every job runs a Makefile target and nothing else.
#
# check_workflow.py asserts that: a workflow with its own copy of a command is
# a second definition that will drift from the first, and the drift is only
# noticed when CI passes something that fails locally, or the reverse.
#
# No `continue-on-error:` anywhere, deliberately. A step allowed to fail is a
# check that reports green while knowing better.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing here publishes, comments or writes a tag.
permissions:
  contents: read

# A newer push to a pull request cancels the older run. Never on main: the
# full check runs only there. A group of its own per commit on main, because
# a run merely *pending* in a shared group is cancelled by the next one queued
# whatever cancel-in-progress says -- three quick merges lost the middle one.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Tier 1: everything someone with nothing but Python installed can run.
  # Deliberately has no install step -- the Python here is standard library
  # only, and the absence of a `pip install` line is an assertion about that.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test-python
      # T18's held-out comparison reads only committed files and the standard
      # library, so it is tier 1 and runs here, not beside the engine.
      - run: make test-clone-report

  # What needs the network or the pull request itself, and no engine.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The lints themselves run in the godot job: inside `make check-affected`
      # on a pull request, inside `make check` on main. Here only what needs
      # the network or the pull request.
      - run: make lint-links-remote

      # A hook cannot see a pull request. The commit messages on the branch go
      # through .githooks/commit-msg locally, but the PR's own title and body
      # are written in a browser and reach main through the squash message --
      # so they are checked here, where they exist.
      #
      # Title and body arrive through `env:`, never interpolated into the shell:
      # a PR title is attacker-controlled text, and `${{ }}` inside a `run:`
      # would evaluate it as part of the command.
      - name: the PR's own title and body obey the same rules
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: make lint-pr-message

  # Tier 2: the engine. Bootstrap runs here on every build, which means the
  # bootstrap path is exercised by CI rather than only on the author's desk.
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-affected diffs against main, and lint-employer-refs walks the
          # history; a shallow clone has neither.
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/toolchain
          key: godot-${{ hashFiles('.godot-version', 'scripts/bootstrap.sh') }}
      - run: make bootstrap TOOLCHAIN=${{ runner.temp }}/toolchain
        env:
          # The export templates are 1.28 GB and only `make export` uses them.
          GAK_SKIP_TEMPLATES: "1"
      # T58. A pull request runs what its change selects: every lint, and the
      # gates of the modules it touches plus every module that uses them.
      - run: make check-affected BASE=origin/main
        if: github.event_name == 'pull_request'
        env:
          GAK_TOOLCHAIN: ${{ runner.temp }}/toolchain

      # A push to main runs the whole check. First the selector is asked
      # about the same commit: if it passes and the full check fails, a
      # manifest is missing a dependency -- a finding against modules/, not a
      # flaky test.
      #
      # One `make check`, not a step per gate. The steps were a second list of
      # what `make check` holds, and every wave that added a gate had to edit
      # this file -- which made it global, and every such wave select
      # everything. make names the target that failed.
      #
      # The base is what main was before this push, not HEAD^1: a push that
      # carries several commits is checked for all of them. And the full
      # check runs whether or not the selector's did -- the comparison is the
      # point.
      - run: make check-affected BASE=$BEFORE
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          GAK_TOOLCHAIN: ${{ runner.temp }}/toolchain
      - run: make check
        if: ${{ !cancelled() && github.event_name == 'push' }}
        env:
          GAK_TOOLCHAIN: ${{ runner.temp }}/toolchain
